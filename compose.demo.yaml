name: construction-demo
services:
  mysql:
    image: mysql:8.4
    container_name: construction-demo-mysql
    labels:
      com.construction.purpose: isolated-visitor-demo-v1
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_DATABASE: fitimi_dev_demo_control
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/demo_mysql_password
    secrets:
      - demo_mysql_password
    volumes:
      - demo_mysql_data:/var/lib/mysql
    command: ["--skip-log-bin", "--max-connections=60"]
    mem_limit: 1g
    restart: unless-stopped
secrets:
  demo_mysql_password:
    file: .private/demo/mysql-password
volumes:
  demo_mysql_data:
